<div class="menu-management-container">
  <div class="header">
    <h1>Menu Management</h1>
    <button class="btn btn-primary" (click)="showAddForm()">
      <i class="bi bi-plus-lg"></i> Add New Item
    </button>
  </div>

  <!-- Category Filter -->
  <div class="filter-section">
    <label for="category-filter">Filter by Category:</label>
    <select id="category-filter" [(ngModel)]="selectedCategory" (change)="filterByCategory(selectedCategory)" class="form-select">
      <option value="All">All Categories</option>
      <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
    </select>
  </div>

  <!-- Menu Items Grid -->
  <div class="menu-items-grid">
    <div *ngFor="let item of filteredItems" class="menu-item-card">
      <div class="item-header">
        <h3>{{ item.name }}</h3>
        <div class="item-actions">
          <button class="btn btn-sm btn-secondary" (click)="showEditForm(item)" title="Edit">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteMenuItem(item.id!)" title="Delete">
            <i class="bi bi-trash"></i>
          </button>
          <button 
            class="btn btn-sm" 
            [class.btn-success]="item.available" 
            [class.btn-warning]="!item.available"
            (click)="toggleAvailability(item)" 
            [title]="item.available ? 'Mark as Unavailable' : 'Mark as Available'">
            <i class="bi" [class.bi-eye]="item.available" [class.bi-eye-slash]="!item.available"></i>
          </button>
        </div>
      </div>
      
      <div class="item-details">
        <p class="description">{{ item.description || 'No description available' }}</p>
        <div class="item-meta">
          <span class="price">${{ item.price.toFixed(2) }}</span>
          <span class="category">{{ item.category }}</span>
          <span class="availability" [class.available]="item.available" [class.unavailable]="!item.available">
            {{ item.available ? 'Available' : 'Unavailable' }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- No items message -->
  <div *ngIf="filteredItems.length === 0" class="no-items">
    <p>No menu items found for the selected category.</p>
  </div>

  <!-- Add/Edit Form Modal -->
  <div *ngIf="isFormVisible" class="modal-overlay" (click)="hideForm()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ isEditMode ? 'Edit Menu Item' : 'Add New Menu Item' }}</h2>
        <button class="close-btn" (click)="hideForm()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      
      <form (ngSubmit)="saveMenuItem()" class="menu-item-form">
        <div class="form-group">
          <label for="name">Name *</label>
          <input 
            type="text" 
            id="name" 
            [(ngModel)]="formData.name" 
            name="name" 
            required 
            class="form-control"
            placeholder="Enter item name">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea 
            id="description" 
            [(ngModel)]="formData.description" 
            name="description" 
            class="form-control"
            rows="3"
            placeholder="Enter item description"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="price">Price *</label>
            <input 
              type="number" 
              id="price" 
              [(ngModel)]="formData.price" 
              name="price" 
              required 
              min="0" 
              step="0.01" 
              class="form-control"
              placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <input 
              type="text" 
              id="category" 
              [(ngModel)]="formData.category" 
              name="category" 
              required 
              class="form-control"
              placeholder="Enter category">
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              [(ngModel)]="formData.available" 
              name="available">
            <span class="checkmark"></span>
            Available for ordering
          </label>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" (click)="hideForm()">Cancel</button>
          <button type="submit" class="btn btn-primary">
            {{ isEditMode ? 'Update Item' : 'Add Item' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
